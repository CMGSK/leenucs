# Validate with: mango -c ~/.config/mango/config.conf -p

# Session environment
env=XCURSOR_THEME,Twilight-cursors
env=XCURSOR_SIZE,24
env=GTK_IM_MODULE,fcitx
env=QT_IM_MODULE,fcitx
env=QT_IM_MODULES,wayland;fcitx
env=SDL_IM_MODULE,fcitx
env=XMODIFIERS,@im=fcitx
env=GLFW_IM_MODULE,ibus

# Startup
exec_once=noctalia
exec_once=fcitx5 -D
exec_once=obs --startreplaybuffer --minimize-to-tray
exec_once=~/.config/mango/init-workspaces.sh

# Displays: OMEN is primary/left; AOC is secondary/right.
monitor_rule=name:^DP-1$,make:HP Inc.,model:OMEN 27q,width:2560,height:1440,refresh:164.834,x:0,y:0,scale:1,primary:1
monitor_rule=name:^DP-2$,make:PNP(AOC),model:24G2W1G4,width:1920,height:1080,refresh:144,x:2560,y:0,scale:1

# Input behavior 
xkb_rules_layout=us
xkb_rules_options=caps:escape
mouse_accel_speed=0.2
mouse_accel_profile=1
mouse_natural_scrolling=0
cursor_size=24
sloppy_focus=1
warp_cursor=0
focus_cross_monitor=0
focus_cross_tag=0
exchange_cross_monitor=1
enable_hotarea=0

# Dwindle everywhere (never enter the scroller layout).
tag_num=9
tag_gather=0
circle_layout=dwindle
dwindle_split_ratio=0.5
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0
dwindle_smart_resize=0

# Spacing and decoration.
gap_inner_horizontal=6
gap_inner_vertical=6
gap_outer_horizontal=6
gap_outer_vertical=6
smart_gaps=0
border_px=2
border_radius=4
no_border_when_single=0
no_radius_when_single=0
shadows=0
layer_shadows=0
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0

# Snap window mapping, unmapping, movement, and dwindle reflow. Tag switching
# retains Mango's default animation.
animation_type_open=none
animation_type_close=none
animation_duration_move=0
tag_animation_direction=0

# Noctalia generates this file from the current palette.
source_optional=~/.config/mango/noctalia.conf

# Persistent odd tags on main monitor and even tags on secondary. 
# The numbered view/send binds below enforce the pairing.
tag_rule=id:*,layout_name:dwindle
tag_rule=id:1,monitor_name:DP-1,no_hide:1,layout_name:dwindle
tag_rule=id:3,monitor_name:DP-1,no_hide:1,layout_name:dwindle
tag_rule=id:5,monitor_name:DP-1,no_hide:1,layout_name:dwindle
tag_rule=id:7,monitor_name:DP-1,no_hide:1,layout_name:dwindle
tag_rule=id:9,monitor_name:DP-1,no_hide:1,layout_name:dwindle
tag_rule=id:2,monitor_name:DP-2,no_hide:1,layout_name:dwindle
tag_rule=id:4,monitor_name:DP-2,no_hide:1,layout_name:dwindle
tag_rule=id:6,monitor_name:DP-2,no_hide:1,layout_name:dwindle
tag_rule=id:8,monitor_name:DP-2,no_hide:1,layout_name:dwindle

# Window rules
window_rule=is_floating:1,app_id:^zen$,title:^Picture-in-Picture$
window_rule=monitor:DP-2,app_id:^discord$
window_rule=monitor:DP-2,app_id:^fluxer$
window_rule=monitor:DP-2,app_id:^teamspeak-client$
window_rule=force_fake_maximize:1,app_id:^(zen|stremio)$
window_rule=focused_opacity:0.8,unfocused_opacity:0.8,app_id:^(ghostty|com\.mitchellh\.ghostty)$

# Applications and shell
bind=SUPER,Return,spawn,ghostty
bind=SUPER,D,spawn,noctalia msg panel-toggle launcher
bind=SUPER,E,spawn,zen-browser
bind=SUPER+SHIFT,L,spawn,swaylock
bind=ALT,F10,spawn,/home/miku/.local/bin/obs-save-replay

# Media keys (same commands and increments as Niri)
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+ -l 1.0
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioStop,spawn,playerctl stop
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl --class=backlight set +10%
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl --class=backlight set 10%-

# Window focus and movement
bind=SUPER,O,toggleoverview
bind=SUPER,Q,killclient
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,H,focusdir,left
bind=SUPER,J,focusdir,down
bind=SUPER,K,focusdir,up
bind=SUPER,L,focusdir,right
bind=SUPER+CTRL,Left,move_client,left
bind=SUPER+CTRL,Down,move_client,down
bind=SUPER+CTRL,Up,move_client,up
bind=SUPER+CTRL,Right,move_client,right
bind=SUPER+CTRL,H,move_client,left
bind=SUPER+CTRL,J,move_client,down
bind=SUPER+CTRL,K,move_client,up
bind=SUPER+CTRL,L,move_client,right
bind=SUPER,Home,focusstack,prev
bind=SUPER,End,focusstack,next
bind=SUPER+CTRL,Home,exchange_stack_client,prev
bind=SUPER+CTRL,End,exchange_stack_client,next

# Move to another monitor
bind=SUPER+SHIFT+CTRL,Left,tagmon,left,0
bind=SUPER+SHIFT+CTRL,Down,tagmon,down,0
bind=SUPER+SHIFT+CTRL,Up,tagmon,up,0
bind=SUPER+SHIFT+CTRL,Right,tagmon,right,0
bind=SUPER+SHIFT+CTRL,H,tagmon,left,0
bind=SUPER+SHIFT+CTRL,J,tagmon,down,0
bind=SUPER+SHIFT+CTRL,K,tagmon,up,0
bind=SUPER+SHIFT+CTRL,L,tagmon,right,0

# Workspace navigation skips tags assigned to the other monitor.
bind=SUPER,Page_Down,spawn,~/.config/mango/workspace-step.sh view 1
bind=SUPER,Page_Up,spawn,~/.config/mango/workspace-step.sh view -1
bind=SUPER,U,spawn,~/.config/mango/workspace-step.sh view 1
bind=SUPER,I,spawn,~/.config/mango/workspace-step.sh view -1
bind=SUPER+CTRL,Page_Down,spawn,~/.config/mango/workspace-step.sh tag 1
bind=SUPER+CTRL,Page_Up,spawn,~/.config/mango/workspace-step.sh tag -1
bind=SUPER+CTRL,U,spawn,~/.config/mango/workspace-step.sh tag 1
bind=SUPER+CTRL,I,spawn,~/.config/mango/workspace-step.sh tag -1

# Numbered workspaces: odds to main monitor, evens to secondary.
bind=SUPER,1,viewcrossmon,1,DP-1
bind=SUPER,2,viewcrossmon,2,DP-2
bind=SUPER,3,viewcrossmon,3,DP-1
bind=SUPER,4,viewcrossmon,4,DP-2
bind=SUPER,5,viewcrossmon,5,DP-1
bind=SUPER,6,viewcrossmon,6,DP-2
bind=SUPER,7,viewcrossmon,7,DP-1
bind=SUPER,8,viewcrossmon,8,DP-2
bind=SUPER,9,viewcrossmon,9,DP-1
bind=SUPER+SHIFT,1,tagcrossmon,1,DP-1
bind=SUPER+SHIFT,2,tagcrossmon,2,DP-2
bind=SUPER+SHIFT,3,tagcrossmon,3,DP-1
bind=SUPER+SHIFT,4,tagcrossmon,4,DP-2
bind=SUPER+SHIFT,5,tagcrossmon,5,DP-1
bind=SUPER+SHIFT,6,tagcrossmon,6,DP-2
bind=SUPER+SHIFT,7,tagcrossmon,7,DP-1
bind=SUPER+SHIFT,8,tagcrossmon,8,DP-2
bind=SUPER+SHIFT,9,tagcrossmon,9,DP-1

# Dwindle/group and sizing.
bind=SUPER,bracketleft,groupjoin,left
bind=SUPER,bracketright,groupjoin,right
bind=SUPER,comma,groupjoin,down
bind=SUPER,period,groupleave
bind=SUPER,R,dwindle_toggle_current_split
bind=SUPER+SHIFT,R,dwindle_toggle_split_direction
bind=SUPER+CTRL,R,setlayout,dwindle
bind=SUPER,F,togglemaximizescreen
bind=SUPER+SHIFT,F,togglefullscreen
bind=SUPER+CTRL,F,togglemaximizescreen
bind=SUPER,C,centerwin
bind=SUPER+CTRL,C,toggleoverview,1
bind=SUPER,minus,smartresizewin,left
bind=SUPER,equal,smartresizewin,right
bind=SUPER+SHIFT,minus,smartresizewin,up
bind=SUPER+SHIFT,equal,smartresizewin,down
bind=SUPER,space,togglefloating
bind=SUPER+SHIFT,V,toggle_all_floating
bind=SUPER,W,togglegroupbar

# Screenshots through the existing Noctalia/Quickshell UI.
bind=SUPER,P,spawn,noctalia msg screenshot-region
bind=CTRL+SUPER,P,spawn,noctalia msg screenshot-fullscreen

# Session and display power
bind=CTRL+ALT,Delete,quit
bind=SUPER+SHIFT,P,spawn,noctalia msg dpms-off
bind=SUPER+SHIFT,slash,reload_config

# Mouse behavior
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,spawn,~/.config/mango/workspace-step.sh view -1
axisbind=SUPER,DOWN,spawn,~/.config/mango/workspace-step.sh view 1
axisbind=SUPER+CTRL,UP,spawn,~/.config/mango/workspace-step.sh tag -1
axisbind=SUPER+CTRL,DOWN,spawn,~/.config/mango/workspace-step.sh tag 1

source=~/.config/mango/noctalia.conf
